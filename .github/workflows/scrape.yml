# .github/workflows/scrape.yml
# Exécute le scraper chaque matin, puis commite les JSON mis à jour.
name: Scrape données IA

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 06:00 UTC
  workflow_dispatch: {} # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour pousser les JSON mis à jour

concurrency:
  group: scrape-quotidien
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lancer le scraper
        run: node scrape.mjs
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}

      - name: Commiter et pousser les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
          else
            git commit -m "data: mise à jour quotidienne (actus + classements)"
            git pull origin main --rebase
            git push
          fi
